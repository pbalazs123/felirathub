# Self-hosting FeliratHUB with Docker Compose: `docker compose up -d`; update with `docker compose pull && docker compose up -d`.
services:
  felirathub:
    image: pbalazs123/supersubtitles:latest   # or :dev for test builds
    # build: .                                 # uncomment to build from this repository instead
    container_name: felirathub
    restart: unless-stopped
    ports:
      # Only reachable from this host; put a reverse proxy with HTTPS in front of it.
      - "127.0.0.1:7000:7000"
    environment:
      DATA_DIR: /data                          # request history and daily statistics (SQLite)
      CACHE_DIR: /data/cache                   # keeps caches across restarts
      # DASHBOARD_PASSWORD: change-me          # enables the admin dashboard at /dashboard
      # OPENSUBTITLES: "0"                     # OpenSubtitles off for new installs
      # PUBLIC_URL: https://subs.example.com   # only if links come out with the wrong address
    volumes:
      - felirathub-data:/data

volumes:
  felirathub-data:
