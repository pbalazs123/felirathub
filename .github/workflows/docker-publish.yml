# Builds amd64 + arm64 images and pushes them to Docker Hub and GHCR.
# - Push to main: tags the image `dev` (test builds; `latest` and releases only come from tags).
# - Push a vX.Y.Z tag: tags `X.Y.Z`, `X.Y`, `X` (from 1.0 on) and `latest`, updates the Docker Hub
#   overview and creates a GitHub release from the annotated tag message. Tags like v1.0.0-beta.1
#   become a pre-release (image tags `1.0.0-beta.1` and `latest`).
name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: pbalazs123/felirathub
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/felirathub

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, 1, latest (no tag per commit: they only pile up)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Needs a Docker Hub token with Read, Write & Delete scope; a failure here
      # doesn't fail the release.
      - name: Update Docker Hub overview
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: Hungarian & English subtitles for Stremio and Nuvio from feliratok.eu and OpenSubtitles
          readme-filepath: ./.github/DOCKERHUB.md

      # Release notes come from the annotated tag message (git tag -a vX.Y.Z).
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --notes-from-tag $prerelease --title "FeliratHUB $TAG"
